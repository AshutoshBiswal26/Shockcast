[project]
name = "shockcast"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "duckdb", "pandas", "numpy", "scipy", "pyarrow",
  "pydantic>=2", "pydantic-settings", "pyyaml",
  "statsforecast", "lightgbm", "torch", "chronos-forecasting",
  "ruptures", "httpx", "tenacity",
  "fastapi", "uvicorn", "streamlit", "plotly",
]

[project.scripts]
shockcast = "shockcast.cli:main"

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff", "mypy", "pandas-stubs", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shockcast"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src/shockcast"]

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --import-mode=importlib"
